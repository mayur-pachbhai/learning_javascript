<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dom Examples</title>
</head>
<body>
  <h1>Change Text Using DOM</h1>
  <h2 id="title">Old Heading</h2>
  <button onclick="changeText()">Change Text</button>

  <script>
    function changeText(){
      document.getElementById("title").innerHTML = "New Heading Added";
    }
  </script>

  <h1>Change Text Color</h1>
  <h2 id="msg" style="color: red; background-color: yellow;">This is a message</h2>
  <button onclick="changeColor()">Change color</button>

  <script>
    function changeColor(){
      document.getElementById("msg").style ="color: blue; background-color:pink";   //OR style.color ="green";
    }
  </script>

  <hr>

  <img src="images/farm_image_5.jpg" id="myImg" alt="img">
  <button onclick="changeImg()">Change Image</button>

  <script>
    function changeImg(){
      document.getElementById("myImg").src='images/tomato.jpg';
    }
  </script>

  <hr>
  <input type="text" placeholder="Enter Name" id="nameInput">
  <button onclick="showName()">Submit</button>
  <h3 id="output"></h3>

  <script>
    function showName(){
      let name = document.getElementById("nameInput").value;
      document.getElementById("output").innerHTML = 'Hello Welcome ' + name;
    }
  </script>

  <hr>

  <p id="para">Lorem ipsum dolor sit amet consectetur adipisicing elit. Ipsam autem cum debitis itaque totam cumque repudiandae minus explicabo magnam facere officia assumenda, molestiae perferendis asperiores quos atque ex, fuga non.</p>

  <button onclick="increase()">+</button>
  <button onclick="decrase()">-</button>

  <script>
    let size = 16;
    function increase(){
      size++;
      document.getElementById("para").style.fontSize = size + 'px';
    }

    function decrase(){
      size--;
      document.getElementById("para").style.fontSize = size + "px";
    }
  </script>
</body>
</html>
