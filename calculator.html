<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous" />
  </head>
  <body>
    <main>
      <div class="container mt-10">
        <div class="row">
          <h1 class="text-center">Arethmatic Calculator</h1>
          <form name="myform">
            <div class="row">
              <div class="md:col-4"></div>
              <div
                class="md:col-4 border bg-secondary rounded-8 mt-10 mb-10 p-10">
                <label for="exampleFormControlInput" class="form-label mb-2">Enter Number 1</label>
                <input type="number" class="form-control mb-4" id="exampleFormControlInput" name="no1" placeholder="Enter No" />

                <label for="exampleFormControlInput" class="form-label mb-2">Enter Number 2</label>
                <input type="number" class="form-control mb-4" id="exampleFormControlInput" name="no2" placeholder="Enter No" />

                <div class="row mt-10 mb-10">
                  <div class="md:col-2"></div>

                  <div class="md:col-2">
                    <button type="button" class="btn-solid theme-success mb-4 w-100 fs-lg" onclick="add()"> + </button>
                  </div>
                  <div class="md:col-2">
                    <button type="button" class="btn-solid theme-success mb-4 w-100 fs-lg" onclick="sub()"> - </button>
                  </div>
                  <div class="md:col-2">
                    <button type="button" class="btn-solid theme-success mb-4 w-100 fs-lg" onclick="multi()"> * </button>
                  </div>
                  <div class="md:col-2">
                    <button type="button" class="btn-solid theme-success mb-4 w-100 fs-lg" onclick="div()"> / </button>
                  </div>

                  <div class="md:col-2"></div>


                  <div class="md:col-3"></div>

                  <div class="md:col-6 mt-6">
                    <button type="reset" class="btn-solid theme-danger mb-2 w-100 fs-lg"> Reset </button>
                  </div>

                  <div class="md:col-3"></div>
                </div>

                <label for="exampleFormControlInput" class="form-label mb-2">Result</label>
                <input type="number" class="form-control mb-4" id="exampleFormControlInput" name="res" placeholder="Result" disabled />
              </div>

              <div class="md:col-4"></div>
            </div>
          </form>
        </div>
      </div>
    </main>

    <script>
      var a, b, resulr;

      function add(){
        a=Number(document.myform.no1.value);
        b=Number(document.myform.no2.value)
        result = a + b;

        document.myform.res.value = result.toFixed(2);
      }

      function sub(){
        a=Number(document.myform.no1.value);
        b=Number(document.myform.no2.value)
        result = a - b;

        document.myform.res.value = result.toFixed(2);
      }

      function multi(){
        a=Number(document.myform.no1.value);
        b=Number(document.myform.no2.value)
        result = a*b;

        document.myform.res.value = result.toFixed(2);
      }

      function div(){
        a=Number(document.myform.no1.value);
        b=Number(document.myform.no2.value)
        result = a/b;

        document.myform.res.value = result.toFixed(2);
      }
    </script>

  </body>
</html>
