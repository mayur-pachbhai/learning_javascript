<body>
  <h1>Welcome to Javascript types</h1>

  <!-- Inline JS -->
   <button onclick="alert('Inline JS Example')">Inline JS Click Me</button>

   <!-- Internal js -->

  <!-- External JS -->
    <button onclick="displayMessage()">External JS click me</button>
    <script>
      function showMessage(){
        alert("Internal JS Example");
      }
    </script>

  <script src="js/script.js">
    
  </script>
  
</body>
