<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Datatypes in js</title>
</head>
<body>
  <script>
    var a = "Anand";
    var b = 234.67;
    var c = true;
    var d = ["HTML","CSS","BOOTSTRAP","JS"];
    var e = {fname:"Mayur",lname:"Pachbhai"};
    var f = null;
    var g;
    function myFunc(){
      return "Hello";
    }
    myFunc();

    document.write(a + "<br>");
    document.write(typeof a + "<br> <hr>");

    document.write(b + "<br>");
    document.write(typeof b + "<br> <hr>");

    document.write(c + "<br>");
    document.write(typeof c + "<br> <hr>");

    document.write(d + "<br>");
    document.write(typeof d + "<br> <hr>");

    document.write(e + "<br>");
    document.write(typeof e + "<br> <hr>");

    document.write(f + "<br>");
    document.write(typeof f + "<br> <hr>");

    document.write(g + "<br>");
    document.write(typeof g + "<br> <hr>");

    document.write(myFunc() + "<br>");
    document.write(typeof myFunc + "<br> <hr>");
  </script>
</body>
</html>
