<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous" />
  </head>

  <body class="bg-light">

    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="md:col-6 md:col-5">
          <div class="card shadow-sm">
            <div class="card-body p-4">

              <h2 class="text-center mb-4">Contact Us</h2>

              <form onsubmit="return validate()">

                <div class="mb-3">
                  <label class="form-label">Name:</label>
                  <input type="text" id="name" class="form-control"
                    placeholder="Your name">
                  <span class="fg-danger" id="nameError"></span>
                </div>

                <div class="mb-3">
                  <label class="form-label">Email:</label>
                  <input type="text" id="email" class="form-control"
                    placeholder="Your email">
                  <span class="fg-danger" id="emailError"></span>
                </div>

                <div class="mb-3">
                  <label class="form-label">Mobile Number:</label>
                  <input type="text" id="mobile" class="form-control"
                    placeholder="Your mobile number">
                  <span class="fg-danger" id="mobileError"></span>
                </div>

                <div class="mb-3">
                  <label class="form-label">Password:</label>
                  <input type="password" id="password" class="form-control"
                    placeholder="Enter password">
                  <span class="fg-danger" id="passwordError"></span>
                </div>

                <div class="mb-3">
                  <label class="form-label">Confirm Password:</label>
                  <input type="password" id="confirmPassword"
                    class="form-control"
                    placeholder="Confirm password">
                  <span class="fg-danger" id="confirmPasswordError"></span>
                </div>

                <div class="mb-3">
                  <label class="form-label">Message:</label>
                  <textarea class="form-control" id="message" rows="4"
                    placeholder="Your message"></textarea>
                  <span class="fg-danger" id="messageError"></span> 
                </div>

                <div class="mb-3">
                  <label class="form-label d-inline">Gender:</label>

                  <div class="form-check form-check-inline">
                    <input type="radio" 
                      name="gender" id="male">
                    <label class="form-check-label"
                      for="male">Male</label>
                  </div>

                  <div class="form-check form-check-inline">
                    <input type="radio" 
                      name="gender" id="female">
                    <label class="form-check-label"
                      for="female">Female</label>
                  </div>

                  <div class="form-check form-check-inline">
                    <input type="radio"
                      name="gender" id="other">
                    <label class="form-check-label"
                      for="other">Other</label>
                  </div>
                  <span class="fg-danger" id="genderError"></span> 
                </div>

                <div class="form-check mb-3">
                  <input type="checkbox" class="form-check-input" id="agree">
                  <label class="form-check-label" for="agree">
                    I agree to the Terms & Conditions
                  </label>
                  <br>
                  <span class="fg-danger" id="agreeError"></span> 
                </div>

                <button type="submit" class="btn bg-primary w-100"> Submit
                </button>

              </form>

            </div>
          </div>

        </div>
      </div>
    </div>


    <script>
      function validate(){
        // Get from values
        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const mobile = document.getElementById("mobile").value.trim();
        const password = document.getElementById("password").value.trim();
        const confirmPassword = document.getElementById("confirmPassword").value.trim();
        const message = document.getElementById("message").value.trim();
        const agree = document.getElementById("agree").checked;
        const gender = document.querySelector('input[name="gender"]:checked');


        // Error span
        const nameError = document.getElementById("nameError");
        const emailError = document.getElementById("emailError");
        const mobileError = document.getElementById("mobileError");
        const passwordError = document.getElementById("passwordError");
        const confirmPasswordError = document.getElementById("confirmPasswordError");
        const messageError = document.getElementById("messageError");
        const genderError = document.getElementById("genderError");
        const agreeError = document.getElementById("agreeError");


        // Clear Privious Error Message
        nameError.textContent = "";
        emailError.textContent = "";
        mobileError.textContent = "";
        passwordError.textContent = "";
        confirmPasswordError.textContent = "";
        messageError.textContent = "";
        genderError.textContent = "";
        agreeError.textContent = "";


        let isValid = true;

        // Validate Fields
        if (name === ""){
          nameError.textContent = "Please enter your name.";
          isValid = false;
        }else if(name.length<3){
          nameError.textContent = "Please enter atleast 3 character.";
          isValid = false;
        }


        if(email === ""){
          emailError.textContent = "Please enter your email.";
          isValid = false;
        }else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
          emailError.textContent = "Please enter valid email address."
          isValid = false;
        }


        if(mobile === ""){
          mobileError.textContent = "Please enter your mobile number.";
          isValid = false;
        }else if(!/^\d{10}$/.test(mobile)){
          mobileError.textContent = "Please enter 10 digit mobile number."
          isValid = false;
        }


        const passwordPattern = /^(?=.*[0-9])(?=.*[!@#$%^&*])[a-zA-Z0-9!@#$%^&*]{6,}$/;
        if(password === ""){
          passwordError.textContent = "Please enter your password.";
          isValid = false;
        }else if(!passwordPattern.test(password)){
          passwordError.textContent = "Password must be at least 6 characters, include a number & a spetial character."
          isValid = false;
        }


        if(confirmPassword === ""){
          confirmPasswordError.textContent = "Please confirm your password.";
          isValid = false;
        }else if(confirmPassword!== password){
          confirmPasswordError.textContent = "Password donot match."
          isValid = false;
        }


        if(message === ""){
          messageError.textContent = "Please enter your message.";
          isValid = false;
        }


        if(!gender){
          genderError.textContent = "Please select your gender.";
          isValid = false;
        }


        if(!agree){
          agreeError.textContent = "You must agree to the terms & conditions.";
          isValid = false;
        }


        if(isValid) {
          alert("From Submitted Successfully");
        }

        return isValid;  // Prevent from submission if invalid
      }
    </script>
  </body>
</html>
