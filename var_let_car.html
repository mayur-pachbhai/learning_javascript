<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>var_let_const</title>
</head>
<body>
  <script>
    var fname = "Nikita";
    var fname = "Divya";  //Redeclaration allowed
    fname = "Saniya";     //Reassign allowed

    document.write(fname +"<br>");
  </script>

  <script>
    let lname = "Jadhav";
    //let lname = "Jadhav"; Redeclaration not allowed
    lname = "Chavan"; // Reassign allowed

    document.write(lname +"<br>");
  </script>

  <script>
    let cname = "TCS";
    //let cname = "IBM"; Redeclaration not allowed
    //cname = "Infosys"; // Reassign not allowed

    document.write(cname +"<br>");
  </script>
</body>
</html>
