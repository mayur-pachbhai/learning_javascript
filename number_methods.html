<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Number Methods</title>
  </head>
  <body>
    <script>
      var a = Math.round(10.6);
      document.write(a + "<br>");

      var b = Math.trunc(10.6); //Without decimal value
      document.write(b + "<br>");

      var c = Math.ceil(10.01); //Nearest Upper Value
      document.write(c + "<br>");

      var d = Math.floor(10.99); //Nearest Lower Value
      document.write(d + "<br>");

      var e = Math.max(34, 76, 45, 21, 43, 56);
      document.write(e + "<br>");

      var f = Math.min(34, 76, 45, 21, 43, 56);
      document.write(f + "<br>");

      var g = Math.sqrt(81);
      document.write(g + "<br>");

      var h = Math.min(125);
      document.write(h + "<br>");

      var i = Math.pow(3,4);
      document.write(i + "<br>");

      var j = Math.random();
      document.write(j + "<br>");

      var k = Math.floor(Math.random() * 10000);
      document.write(k + "<br>");

      var l = Math.PI.toFixed(8);
      document.write(l + "<br>");

      var m = Math.log(2).toFixed(3);
      document.write(m + "<br>");
      
    </script>
  </body>
</html>
